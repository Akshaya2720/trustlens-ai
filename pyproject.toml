[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustlens-ai"
version = "1.0.0"
description = "TrustLens AI: Automated Multimodal Digital Safety Investigation Backend using Meta AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "pillow>=10.4.0",
    "dnspython>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
